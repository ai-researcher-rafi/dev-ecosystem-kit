<!-- Premium Product Card Component with Tailwind CSS -->
<div class="max-w-sm bg-white border border-slate-100 rounded-2xl shadow-sm hover:shadow-xl transition-all duration-300 overflow-hidden group">
  <!-- Image Container with Hover Zoom effect -->
  <div class="relative overflow-hidden aspect-video bg-slate-100">
    <img class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-500" src="https://unsplash.com" alt="Product Image" />
    <span class="absolute top-4 left-4 bg-blue-600 text-white text-xs font-semibold px-2.5 py-1 rounded-full uppercase tracking-wider">New Drop</span>
  </div>
  
  <!-- Content Details Section -->
  <div class="p-6 space-y-4">
    <div class="flex items-center justify-between text-xs text-slate-500 font-medium">
      <span>Category / Tech</span>
      <span class="flex items-center gap-1">★ 4.9 (120 reviews)</span>
    </div>
    
    <h3 class="text-xl font-bold text-slate-900 group-hover:text-blue-600 transition-colors duration-200">
      <a href="#">AirMax Premium Edition</a>
    </h3>
    
    <p class="text-sm text-slate-600 line-clamp-2 leading-relaxed">
      Experience unmatched comfort and engineering with the all-new lightweight mesh upper and dynamic cushioning. Built for everyday performance.
    </p>
    
    <div class="pt-4 border-t border-slate-50 flex items-center justify-between">
      <div class="flex flex-col">
        <span class="text-2xl font-extrabold text-slate-900">$129.99</span>
        <span class="text-xs text-slate-400 line-through">$159.99</span>
      </div>
      <button class="px-4 py-2.5 bg-slate-900 hover:bg-blue-600 text-white font-semibold text-sm rounded-xl shadow-sm transition-all duration-200">
        Add to Cart
      </button>
    </div>
  </div>
</div>
