<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Premium Gemini AI Chat Interface</title>
  <!-- Tailwind CSS CDN for Premium Look -->
  <script src="https://tailwindcss.com"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen flex items-center justify-center p-4">

  <!-- Main Chat Dashboard Window -->
  <div class="w-full max-w-4xl h-[85vh] bg-slate-900 border border-slate-800 rounded-2xl shadow-2xl flex flex-col overflow-hidden">
    
    <!-- Top Header Navigation -->
    <div class="px-6 py-4 bg-slate-800/50 border-b border-slate-800 flex items-center justify-between">
      <div class="flex items-center gap-3">
        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <h2 class="text-lg font-bold tracking-wide">Gemini Core v2.5</h2>
      </div>
      <span class="text-xs text-slate-400 font-mono bg-slate-900 px-3 py-1 rounded-md border border-slate-800">Status: Active</span>
    </div>

    <!-- Live Messages Box Area -->
    <div id="chat-box" class="flex-1 p-6 overflow-y-auto space-y-4 font-normal text-sm leading-relaxed">
      <!-- AI Default Welcome Message -->
      <div class="flex gap-3 max-w-[80%]">
        <div class="w-8 h-8 rounded-lg bg-blue-600 flex items-center justify-center font-bold text-xs shrink-0">AI</div>
        <div class="bg-slate-800 p-4 rounded-2xl rounded-tl-none text-slate-200">
          Hello Md Rafikul Islam! I am your autonomous system assistant. How can I speed up your development pipeline today?
        </div>
      </div>
    </div>

    <!-- Bottom Input Controls Form -->
    <form id="chat-form" class="p-4 bg-slate-950 border-t border-slate-800 flex gap-3">
      <input 
        id="user-input"
        type="text" 
        placeholder="Ask Gemini anything or trigger the autonomous agent pipeline..." 
        class="flex-1 bg-slate-900 border border-slate-800 rounded-xl px-4 py-3 text-sm focus:outline-none focus:border-blue-500 text-slate-100 transition-colors"
        autocomplete="off"
        required
      />
      <button 
        type="submit" 
        class="bg-blue-600 hover:bg-blue-700 text-white font-semibold text-sm px-6 py-3 rounded-xl shadow-lg shadow-blue-600/10 active:scale-[0.98] transition-all"
      >
        Send System
      </button>
    </form>

  </div>

  <script src="app.js"></script>
</body>
</html>
